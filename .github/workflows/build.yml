name: Build ApertureScienceOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar dispositivos de Loop (necessário para o archiso)
        run: |
          sudo modprobe loop
          sudo mknod -m 0660 /dev/loop-control c 10 237 || true
          for i in $(seq 0 7); do
            sudo mknod -m 0660 /dev/loop$i b 7 $i || true
          done

      - name: Executar Build dentro do Container Arch Linux
        run: |
          docker run --privileged \
            -v /dev:/dev \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            bash -c '
              pacman -Sy --noconfirm archlinux-keyring && \
              pacman -Syu --noconfirm && \
              pacman -S --noconfirm archiso git rsync dos2unix syslinux mtools dosfstools squashfs-tools libisoburn edk2-ovmf erofs-utils grub && \
              find . -type f \( -name "*.sh" -o -name "packages.x86_64" -o -name "profiledef.sh" -o -name "pacman.conf" \) -exec dos2unix {} + && \
              if [ -d "ApertureScienceOS_builder" ]; then cd ApertureScienceOS_builder; fi && \
              grep -q "^syslinux$" packages.x86_64 || echo "syslinux" >> packages.x86_64 && \
              for dir in syslinux efiboot grub systemd-boot; do
                if [ -d "/usr/share/archiso/configs/releng/$dir" ] && [ ! -d "$dir" ]; then
                  cp -r "/usr/share/archiso/configs/releng/$dir" . ;
                fi ;
              done && \
              RELENG_BOOT=$(grep -E "^bootmodes=\(" /usr/share/archiso/configs/releng/profiledef.sh) && \
              sed -i "/bootmodes=(/,/)/c\\$RELENG_BOOT" profiledef.sh && \
              chmod +x build.sh && \
              ./build.sh
            '

      - name: Disponibilizar a ISO para Download
        uses: actions/upload-artifact@v4
        with:
          name: ApertureScienceOS-ISO
          path: "**/out/*.iso"
