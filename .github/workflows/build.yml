name: Build ApertureScienceOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar dispositivos de Loop
        run: |
          sudo modprobe loop
          sudo mknod -m 0660 /dev/loop-control c 10 237 || true
          for i in $(seq 0 7); do
            sudo mknod -m 0660 /dev/loop$i b 7 $i || true
          done

      - name: Criar e Executar Script de Compilação
        run: |
          cat << 'EOF' > run_build.sh
          #!/bin/bash

          echo "=== 1. Configurando Chaves do Pacman ==="
          pacman-key --init
          pacman-key --populate archlinux

          echo "=== 2. Atualizando Pacotes Base ==="
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git rsync dos2unix syslinux mtools dosfstools squashfs-tools libisoburn edk2-ovmf erofs-utils grub python wget

          echo "=== 3. Adicionando Repositório Chaotic-AUR ==="
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com || true
          pacman-key --lsign-key 3056513887B78AEB || true
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' || true
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst' || true

          if ! grep -q "chaotic-aur" /etc/pacman.conf; then
            echo "" >> /etc/pacman.conf
            echo "[chaotic-aur]" >> /etc/pacman.conf
            echo "Include = /etc/pacman.d/chaotic-mirrorlist" >> /etc/pacman.conf
          fi
          pacman -Sy --noconfirm

          echo "=== 4. Preparando Estrutura do Projeto ==="
          if [ -d "ApertureScienceOS_builder" ]; then
            cd ApertureScienceOS_builder
          fi

          mkdir -p out

          if [ ! -f "packages.x86_64" ]; then
            cp -r /usr/share/archiso/configs/releng/* .
          fi

          find . -type f \( -name "*.sh" -o -name "packages.x86_64" -o -name "profiledef.sh" -o -name "pacman.conf" \) -exec dos2unix {} + 2>/dev/null || true

          if [ -f "pacman.conf" ] && ! grep -q "chaotic-aur" pacman.conf; then
            echo "" >> pacman.conf
            echo "[chaotic-aur]" >> pacman.conf
            echo "Include = /etc/pacman.d/chaotic-mirrorlist" >> pacman.conf
          fi

          echo "=== 5. Injetando Pacotes da Interface XFCE + Calamares ==="
          PKGS="xorg-server xfce4 xfce4-terminal lightdm lightdm-gtk-greeter calamares networkmanager syslinux firefox"
          for pkg in $PKGS; do
            grep -q "^${pkg}$" packages.x86_64 || echo "$pkg" >> packages.x86_64
          done

          echo "=== 6. Criando Atalho do Calamares no Live Desktop ==="
          mkdir -p airootfs/etc/skel/Desktop
          echo "[Desktop Entry]" > airootfs/etc/skel/Desktop/install-system.desktop
          echo "Type=Application" >> airootfs/etc/skel/Desktop/install-system.desktop
          echo "Name=Instalar Aperture Science OS" >> airootfs/etc/skel/Desktop/install-system.desktop
          echo "Comment=Iniciar o instalador grafico Calamares" >> airootfs/etc/skel/Desktop/install-system.desktop
          echo "Exec=sudo -E calamares" >> airootfs/etc/skel/Desktop/install-system.desktop
          echo "Icon=system-software-install" >> airootfs/etc/skel/Desktop/install-system.desktop
          echo "Terminal=false" >> airootfs/etc/skel/Desktop/install-system.desktop
          echo "Categories=System;" >> airootfs/etc/skel/Desktop/install-system.desktop
          chmod +x airootfs/etc/skel/Desktop/install-system.desktop

          for dir in syslinux efiboot grub systemd-boot; do
            if [ -d "/usr/share/archiso/configs/releng/$dir" ] && [ ! -d "$dir" ]; then
              cp -r "/usr/share/archiso/configs/releng/$dir" .
            fi
          done

          echo "=== 7. Sincronizando Bootmodes ==="
          echo "import re" > patch_profile.py
          echo "releng_path = '/usr/share/archiso/configs/releng/profiledef.sh'" >> patch_profile.py
          echo "with open(releng_path, 'r') as f:" >> patch_profile.py
          echo "    releng = f.read()" >> patch_profile.py
          echo "bm_match = re.search(r'bootmodes=\([\s\S]*?\)', releng)" >> patch_profile.py
          echo "if bm_match:" >> patch_profile.py
          echo "    bm = bm_match.group(0)" >> patch_profile.py
          echo "    with open('profiledef.sh', 'r') as f:" >> patch_profile.py
          echo "        target = f.read()" >> patch_profile.py
          echo "    new_target = re.sub(r'bootmodes=\([\s\S]*?\)', bm, target)" >> patch_profile.py
          echo "    with open('profiledef.sh', 'w') as f:" >> patch_profile.py
          echo "        f.write(new_target)" >> patch_profile.py
          
          python3 patch_profile.py

          echo "=== 8. Gerando a ISO Final ==="
          if [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          else
            mkarchiso -v -w work -o out .
          fi
          EOF

          chmod +x run_build.sh

      - name: Executar Build dentro do Container Arch Linux
        run: |
          docker run --privileged \
            -v /dev:/dev \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            bash /workspace/run_build.sh

      - name: Disponibilizar a ISO para Download
        uses: actions/upload-artifact@v4
        with:
          name: ApertureScienceOS-Calamares-ISO
          path: "**/out/*.iso"
